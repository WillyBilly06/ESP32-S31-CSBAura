## Matches the official esp_ble_audio examples: the LE-Audio API lives in the
## in-tree `bt` component, and the examples pull two helper components for
## bring-up (bluetooth_init / app_host_init) and the ext-adv + TX scheduler.
## These paths exist inside ESP-IDF.
dependencies:
  idf: ">=5.5"
  example_init:
    path: ${IDF_PATH}/examples/bluetooth/esp_ble_audio/common_components/example_init
  example_utils:
    path: ${IDF_PATH}/examples/bluetooth/esp_ble_audio/common_components/example_utils
