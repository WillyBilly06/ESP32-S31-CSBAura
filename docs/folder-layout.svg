  <g font-size="15">
    <path d="M572 93 C 610 93, 610 112, 630 112" fill="none" stroke="#1f5fbf" stroke-width="2"/>
    <circle cx="572" cy="93" r="3" fill="#1f5fbf"/>
    <text x="636" y="104" font-weight="bold" fill="#1f5fbf">1  A short path</text>
    <text x="636" y="124" fill="#1d1d1f">No spaces or accents,</text>
    <text x="636" y="143" fill="#1d1d1f">under 80 characters.</text>
    <text x="636" y="166" fill="#6e6e73" font-style="italic">Đường dẫn ngắn: không dấu cách,</text>
    <text x="636" y="185" fill="#6e6e73" font-style="italic">không dấu tiếng Việt, dưới 80 ký tự.</text>

    <path d="M568 446 C 600 446, 610 352, 630 352" fill="none" stroke="#ff6a00" stroke-width="2"/>
    <circle cx="568" cy="446" r="3" fill="#ff6a00"/>
    <text x="636" y="322" font-weight="bold" fill="#ff6a00">2  The exe goes here</text>
    <text x="636" y="342" fill="#1d1d1f">Next to README.md and</text>
    <text x="636" y="361" fill="#1d1d1f">s31-btstack-speaker, then run it.</text>
    <text x="636" y="384" fill="#6e6e73" font-style="italic">File exe nằm ở đây, cạnh</text>
    <text x="636" y="403" fill="#6e6e73" font-style="italic">README.md và s31-btstack-speaker,</text>
    <text x="636" y="422" fill="#6e6e73" font-style="italic">rồi chạy nó.</text>

    <text x="636" y="500" font-size="13" fill="#6e6e73">The complete download already has</text>
    <text x="636" y="518" font-size="13" fill="#6e6e73">them in place: unzip it to C:\S31.</text>
    <text x="636" y="542" font-size="13" fill="#6e6e73" font-style="italic">Bản đầy đủ đã sắp xếp sẵn như vậy:</text>
    <text x="636" y="560" font-size="13" fill="#6e6e73" font-style="italic">chỉ cần giải nén vào C:\S31.</text>
