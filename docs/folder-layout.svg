  <!-- window -->
  <rect x="24" y="24" width="560" height="512" rx="10" fill="#ffffff" stroke="#d0d3d9"/>
  <rect x="24" y="24" width="560" height="40" rx="10" fill="#eceef2"/>
  <rect x="24" y="54" width="560" height="10" fill="#eceef2"/>
  <circle cx="48" cy="44" r="6" fill="#ff5f57"/><circle cx="68" cy="44" r="6" fill="#febc2e"/><circle cx="88" cy="44" r="6" fill="#28c840"/>
  <text x="112" y="49" font-size="14" fill="#3c4043">File Explorer</text>
  <!-- address bar -->
  <rect x="40" y="76" width="528" height="34" rx="6" fill="#ffffff" stroke="#c4c8cf"/>
  <text x="54" y="98" font-size="15" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">C:\S31\ESP32-S31-CSBAura</text>
  <!-- header -->
  <text x="56" y="140" font-size="12" fill="#6e6e73">Name</text>
  <line x1="40" y1="148" x2="568" y2="148" stroke="#e3e5e9"/>
  <!-- rows -->
  <g font-size="15" fill="#1d1d1f">
    <g transform="translate(0,0)">
      <path d="M58 166 h8 l3 3 h11 v12 h-22z" fill="#f2c14e"/><text x="92" y="180">btstack-patches</text>
    </g>
    <g transform="translate(0,34)">
      <path d="M58 166 h8 l3 3 h11 v12 h-22z" fill="#f2c14e"/><text x="92" y="180">idf-patches</text>
    </g>
    <g transform="translate(0,68)">
      <path d="M58 166 h8 l3 3 h11 v12 h-22z" fill="#f2c14e"/><text x="92" y="180">s31-btstack-speaker</text>
    </g>
    <g transform="translate(0,102)">
      <path d="M58 166 h8 l3 3 h11 v12 h-22z" fill="#f2c14e"/><text x="92" y="180">third_party</text>
    </g>
    <g transform="translate(0,136)">
      <path d="M58 166 h8 l3 3 h11 v12 h-22z" fill="#f2c14e"/><text x="92" y="180">tools</text>
    </g>
    <g transform="translate(0,170)">
      <rect x="60" y="165" width="17" height="19" rx="2" fill="#ffffff" stroke="#8a8f98"/><text x="92" y="180">README.md</text>
    </g>
    <g transform="translate(0,204)">
      <rect x="60" y="165" width="17" height="19" rx="2" fill="#ffffff" stroke="#8a8f98"/><text x="92" y="180">README.vi.md</text>
    </g>
    <!-- the exe, highlighted -->
    <g transform="translate(0,238)">
      <rect x="44" y="158" width="520" height="32" rx="6" fill="#fff1e6" stroke="#ff6a00" stroke-width="2"/>
      <rect x="59" y="164" width="20" height="20" rx="4" fill="#ff6a00"/>
      <text x="64" y="179" font-size="12" fill="#ffffff" font-weight="bold">S</text>
      <text x="92" y="180" font-weight="bold">S31Flasher.exe</text>
    </g>
    <g transform="translate(0,276)">
      <rect x="60" y="165" width="17" height="19" rx="2" fill="#ffffff" stroke="#8a8f98"/><text x="92" y="180">tones.bin</text>
    </g>
  </g>
  <!-- callouts -->
  <g font-size="15">
    <path d="M572 93 C 610 93, 610 112, 630 112" fill="none" stroke="#1f5fbf" stroke-width="2"/>
    <circle cx="572" cy="93" r="3" fill="#1f5fbf"/>
    <text x="636" y="104" font-weight="bold" fill="#1f5fbf">1  A short path</text>
    <text x="636" y="124" fill="#1d1d1f">No spaces or accents,</text>
    <text x="636" y="143" fill="#1d1d1f">under 80 characters.</text>
    <text x="636" y="166" fill="#6e6e73" font-style="italic">Đường dẫn ngắn: không dấu cách,</text>
    <text x="636" y="185" fill="#6e6e73" font-style="italic">không dấu tiếng Việt, dưới 80 ký tự.</text>

    <path d="M568 412 C 600 412, 610 330, 630 330" fill="none" stroke="#ff6a00" stroke-width="2"/>
    <circle cx="568" cy="412" r="3" fill="#ff6a00"/>
    <text x="636" y="300" font-weight="bold" fill="#ff6a00">2  Put the exe here</text>
    <text x="636" y="320" fill="#1d1d1f">Next to README.md and</text>
    <text x="636" y="339" fill="#1d1d1f">s31-btstack-speaker, then run it.</text>
    <text x="636" y="362" fill="#6e6e73" font-style="italic">Đặt file exe ở đây, cạnh</text>
    <text x="636" y="381" fill="#6e6e73" font-style="italic">README.md và s31-btstack-speaker,</text>
    <text x="636" y="400" fill="#6e6e73" font-style="italic">rồi chạy nó.</text>

    <text x="636" y="470" font-size="13" fill="#6e6e73">The whole repository: Code → Download ZIP,</text>
    <text x="636" y="488" font-size="13" fill="#6e6e73">unpacked (or git clone).</text>
    <text x="636" y="508" font-size="13" fill="#6e6e73" font-style="italic">Toàn bộ repository: Code → Download ZIP,</text>
    <text x="636" y="526" font-size="13" fill="#6e6e73" font-style="italic">giải nén (hoặc git clone).</text>
  </g>
